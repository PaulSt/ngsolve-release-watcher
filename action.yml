name: Build for an NGSolve release
description: Set NGSolve pins and the setuptools-scm RC version in the current checkout
inputs:
  ngsolve_version:
    description: NGSolve version; empty leaves the checkout unchanged
    default: ''
  dry_run:
    description: Whether this build is a dry run (recorded in the build metadata)
    default: 'true'
  dependencies:
    description: JSON map of prerequisite package versions (empty resolves from PyPI)
    default: ''
  working-directory:
    description: Path to the package checkout
    default: '.'
  python-version:
    description: Python version to set up (empty uses the existing Python)
    default: '3.13'
outputs:
  version:
    description: Selected package version
    value: ${{ steps.build.outputs.version }}
  published:
    description: Whether this package version is already on PyPI
    value: ${{ steps.build.outputs.published }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      if: inputs.ngsolve_version != '' && inputs.python-version != ''
      with:
        python-version: ${{ inputs.python-version }}
    - if: inputs.ngsolve_version != ''
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NGSOLVE_VERSION: ${{ inputs.ngsolve_version }}
        DRY_RUN: ${{ inputs.dry_run }}
        RELEASE_DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        python -m pip install packaging
        python "$GITHUB_ACTION_PATH/watch.py" build
    - uses: actions/upload-artifact@v7
      if: inputs.ngsolve_version != ''
      with:
        name: ${{ steps.build.outputs.record_name }}
        path: ${{ steps.build.outputs.record_path }}
        if-no-files-found: error
