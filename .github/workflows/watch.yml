name: Watch NGSolve

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Installed add-on repository (owner/name)
        required: true
        default: PaulSt/ngstents
        type: string
      ngsolve_version:
        description: NGSolve version (empty uses the latest stable release)
        type: string
      workflow:
        description: Add-on build workflow filename
        type: string
        default: build.yml
      dry_run:
        description: Build and test the release candidate without uploading to PyPI
        type: boolean
        default: true
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ngsolve-release-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: python -m pip install -r requirements.txt

      - name: Notify installed repositories
        id: notify
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_WORKFLOW: ${{ inputs.workflow }}
          NGSOLVE_VERSION: ${{ inputs.ngsolve_version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python watch.py watch
