name: Watch NGSolve

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Registered repository (owner/name; empty checks all projects)
        type: string
      ngsolve_version:
        description: NGSolve version (empty uses the latest stable release)
        type: string
      workflow:
        description: Override the registered build workflow filename
        type: string
      dry_run:
        description: Build and test the release candidate without uploading to PyPI
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: ngsolve-release-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: python -m pip install -r requirements.txt

      - name: Notify installed repositories
        id: notify
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_WORKFLOW: ${{ inputs.workflow }}
          NGSOLVE_VERSION: ${{ inputs.ngsolve_version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python watch.py watch

      - name: Keep scheduled watcher enabled
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/enable"
