name: Watch NGSolve

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: python -m pip install packaging

      - name: Check targets
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from packaging.version import Version

          targets = [
              "PaulSt/ngstents",
              "PaulSt/NGSTrefftz",
              "ngsxfem/ngsxfem",
          ]

          with urllib.request.urlopen("https://pypi.org/pypi/ngsolve/json") as r:
              data = json.load(r)

          versions = [
              Version(v)
              for v in data["releases"]
              if not Version(v).is_prerelease
              and not Version(v).is_postrelease
              and not Version(v).is_devrelease
          ]

          latest = str(max(versions))

          with open("state.json") as f:
              state = json.load(f)

          print(f"Latest NGSolve release: {latest}")

          for repo in targets:
              if state.get(repo) == latest:
                  print(f"skip: {repo}")
              else:
                  print(f"would notify: {repo}")
          PY

      - name: Create token for ngstents
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PaulSt
          repositories: ngstents
          permission-actions: write

      - name: Send test signal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            --method POST \
            repos/PaulSt/ngstents/actions/workflows/test-watcher-signal.yml/dispatches \
            -f ref=master \
            -f 'inputs[ngsolve_version]=6.2.2608'
